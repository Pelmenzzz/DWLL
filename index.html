<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash World Demon List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Dash World Demon List</h1>

    <nav>
        <button onclick="showPage('list')">Demon List</button>
        <button onclick="showPage('submit')">Submit Level</button>
        <button id="adminLoginButton" onclick="openAdminLogin()">Admin Login</button>
        <button id="adminPanelButton" class="hidden" onclick="toggleAdminPanel()">Admin Panel</button>
    </nav>
</header>

<main>

    <section id="listPage" class="page">
        <div class="card">
            <h2>Demon List</h2>
            <input id="searchInput" type="text" placeholder="Search levels...">
        </div>

        <div id="levels-container"></div>
    </section>

    <section id="submitPage" class="page hidden">
        <div class="card">
            <h2>Submit Level</h2>

            <input id="submitLevelName" type="text" placeholder="Level Name">
            <input id="submitLevelId" type="text" placeholder="Level ID">
            <input id="submitCreatorName" type="text" placeholder="Creator">
            <input id="submitYoutube" type="url" placeholder="YouTube Video (optional)">

            <button onclick="submitLevel()">Submit Level</button>
            <p id="submitMessage"></p>
        </div>
    </section>

    <section id="adminLoginPage" class="page hidden">
        <div class="card small-card">
            <h2>Admin Login</h2>

            <input id="adminId" type="email" placeholder="Admin ID / Email">
            <input id="adminPassword" type="password" placeholder="Password">

            <button onclick="adminLogin()">Login</button>
            <p id="adminLoginMessage"></p>
        </div>
    </section>

    <section id="adminPage" class="page hidden">
        <div class="card">

            <div class="admin-title-row">
                <h2>Admin Panel</h2>
                <button class="secondary" onclick="toggleAdminPanel()">Collapse</button>
            </div>

            <h3 id="formTitle">Add Level</h3>

            <input id="levelName" type="text" placeholder="Level Name">
            <input id="levelId" type="text" placeholder="Level ID">
            <input id="creatorName" type="text" placeholder="Creator">
            <input id="difficulty" type="text" placeholder="Difficulty">
            <input id="youtubeUrl" type="url" placeholder="YouTube Video (optional)">

            <div class="button-row">
                <button id="saveLevelButton" onclick="saveLevel()">Add Level</button>
                <button id="cancelEditButton" class="secondary hidden" onclick="cancelEdit()">Cancel Edit</button>
            </div>

            <p id="addLevelMessage"></p>

            <hr>

            <h3>Current Levels</h3>

            <div id="admin-levels-container"></div>

            <button class="logout-button" onclick="adminLogout()">Logout</button>

        </div>
    </section>

</main>

<footer>
    <p>Dash World Demon List</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
