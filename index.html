<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dash World Demon List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <h1>Dash World Demon List</h1>

        <p>The hardest levels in Dash World</p>

    </header>


    <!-- NAVIGATION -->

    <nav>

        <div class="nav-buttons">

            <button onclick="showPage('list')">
                Demon List
            </button>

            <button onclick="showPage('players')">
                Players
            </button>

            <button onclick="showPage('submit')">
                Submit
            </button>

        </div>


        <button
            class="admin-button"
            onclick="showPage('admin')">

            🔐 Admin Login

        </button>

    </nav>


    <!-- MAIN CONTENT -->

    <main>


        <!-- DEMON LIST -->

        <section
            id="list"
            class="page">

            <h2>🏆 Demon List</h2>


            <input
                type="text"
                id="search"
                placeholder="Search for a level..."
                oninput="searchLevels()">


            <div id="levels"></div>

        </section>



        <!-- PLAYERS -->

        <section
            id="players"
            class="page hidden">

            <h2>👤 Players</h2>

            <p>
                Player rankings will appear here.
            </p>

        </section>



        <!-- ADMIN LOGIN -->

        <section
            id="admin"
            class="page hidden">

            <h2>🔐 Admin Login</h2>

            <p>
                Administrator access only.
            </p>


            <form
                onsubmit="adminLogin(event)">


                <input
                    type="text"
                    id="adminID"
                    placeholder="Admin ID"
                    required>


                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Password"
                    required>


                <button type="submit">
                    Login
                </button>


            </form>


            <p id="loginMessage"></p>

        </section>



        <!-- SUBMIT -->

        <section
            id="submit"
            class="page hidden">

            <h2>📤 Submit a Level</h2>


            <p>
                Have you created or beaten
                a difficult level?
                Send it to us for verification.
            </p>


            <form
                onsubmit="submitLevel(event)">


                <input
                    type="text"
                    id="levelName"
                    placeholder="Level name"
                    required>


                <input
                    type="text"
                    id="levelID"
                    placeholder="Level ID"
                    required>


                <input
                    type="text"
                    id="creator"
                    placeholder="Creator name"
                    required>


                <input
                    type="text"
                    id="player"
                    placeholder="Your username"
                    required>


                <input
                    type="url"
                    id="youtube"
                    placeholder="YouTube video (optional)">


                <button type="submit">
                    Submit Level
                </button>


            </form>


            <p id="submitMessage"></p>

        </section>


    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            Dash World Demon List • Community project
        </p>

    </footer>


    <!-- JAVASCRIPT -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
