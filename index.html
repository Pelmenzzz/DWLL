<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash World Demon List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Dash World Demon List</h1>

    <nav>
        <button onclick="showPage('list')">Demon List</button>

        <button onclick="showPage('submit')">
            Submit Level
        </button>

        <button id="playerAuthButton" onclick="openPlayerAuth()">
            Player Login
        </button>

        <button id="adminLoginButton" onclick="openAdminLogin()">
            Admin Login
        </button>

        <button
            id="adminPanelButton"
            class="hidden"
            onclick="toggleAdminPanel()"
        >
            Admin Panel
        </button>

        <button
            id="playerLogoutButton"
            class="secondary hidden"
            onclick="playerLogout()"
        >
            Logout
        </button>
    </nav>

    <p id="currentUserLabel" class="current-user"></p>
</header>


<main>

    <!-- DEMON LIST -->

    <section id="listPage" class="page">

        <div class="card">
            <h2>Demon List</h2>

            <input
                id="searchInput"
                type="text"
                placeholder="Search levels..."
                oninput="loadLevels()"
            >
        </div>

        <div id="levels-container"></div>

    </section>


    <!-- SUBMIT LEVEL -->

    <section id="submitPage" class="page hidden">

        <div class="card small-card">

            <h2>Submit Level</h2>

            <p>
                Submit your level for review by the administrator.
            </p>

            <input
                id="submitLevelName"
                type="text"
                placeholder="Level Name"
            >

            <input
                id="submitLevelId"
                type="text"
                placeholder="Level ID (or unknown)"
            >

            <input
                id="submitCreatorName"
                type="text"
                placeholder="Creator Name"
            >

            <input
                id="submitDifficulty"
                type="text"
                placeholder="Difficulty (optional)"
            >

            <input
                id="submitYoutubeUrl"
                type="url"
                placeholder="YouTube URL (optional)"
            >

            <div class="button-row">
                <button onclick="submitLevel()">
                    Submit Level
                </button>

                <button
                    class="secondary"
                    onclick="showPage('list')"
                >
                    Cancel
                </button>
            </div>

            <p id="submitMessage"></p>

        </div>

    </section>


    <!-- PLAYER AUTH -->

    <section id="playerAuthPage" class="page hidden">

        <div class="card small-card">

            <h2>Player Account</h2>

            <div id="playerLoginForm">

                <h3>Login</h3>

                <input
                    id="playerLoginEmail"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="playerLoginPassword"
                    type="password"
                    placeholder="Password"
                >

                <button onclick="playerLogin()">
                    Login
                </button>

                <p>
                    Don't have an account?
                    <button
                        class="link-button"
                        onclick="showRegisterForm()"
                    >
                        Register
                    </button>
                </p>

            </div>


            <div id="playerRegisterForm" class="hidden">

                <h3>Register</h3>

                <input
                    id="registerUsername"
                    type="text"
                    placeholder="Username"
                >

                <input
                    id="registerEmail"
                    type="email"
                    placeholder="Email"
                >

                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Password"
                >

                <input
                    id="registerPassword2"
                    type="password"
                    placeholder="Confirm Password"
                >

                <button onclick="playerRegister()">
                    Register
                </button>

                <p>
                    Already have an account?
                    <button
                        class="link-button"
                        onclick="showLoginForm()"
                    >
                        Login
                    </button>
                </p>

            </div>

            <p id="playerAuthMessage"></p>

        </div>

    </section>


    <!-- ADMIN LOGIN -->

    <section id="adminLoginPage" class="page hidden">

        <div class="card small-card">

            <h2>Admin Login</h2>

            <input
                id="adminEmail"
                type="email"
                placeholder="Admin Email"
            >

            <input
                id="adminPassword"
                type="password"
                placeholder="Admin Password"
            >

            <div class="button-row">

                <button onclick="adminLogin()">
                    Login
                </button>

                <button
                    class="secondary"
                    onclick="showPage('list')"
                >
                    Cancel
                </button>

            </div>

            <p id="adminLoginMessage"></p>

        </div>

    </section>


    <!-- ADMIN PANEL -->

    <section id="adminPage" class="page hidden">

        <div class="card">

            <div class="admin-title-row">

                <h2>Admin Panel</h2>

                <button
                    class="secondary"
                    onclick="showPage('list')"
                >
                    Back to Demon List
                </button>

            </div>

            <hr>

            <h3 id="adminFormTitle">
                Add Level
            </h3>

            <input
                id="levelName"
                type="text"
                placeholder="Level Name"
            >

            <input
                id="levelId"
                type="text"
                placeholder="Level ID (or unknown)"
            >

            <input
                id="creatorName"
                type="text"
                placeholder="Creator Name"
            >

            <input
                id="difficulty"
                type="text"
                placeholder="Difficulty (optional)"
            >

            <input
                id="youtubeUrl"
                type="url"
                placeholder="YouTube URL (optional)"
            >

            <div class="button-row">

                <button onclick="saveLevel()">
                    Save Level
                </button>

                <button
                    id="cancelEditButton"
                    class="secondary hidden"
                    onclick="cancelEdit()"
                >
                    Cancel Edit
                </button>

            </div>

            <p id="addLevelMessage"></p>

        </div>


        <div class="card">

            <h2>Current Levels</h2>

            <div id="admin-levels-container"></div>

        </div>

    </section>

</main>


<footer>
    Dash World Demon List
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
